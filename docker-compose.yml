services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-5.6-luna}
      - AGENT_MAX_STEPS=${AGENT_MAX_STEPS:-30}
      - AGENT_TASK_TIMEOUT=${AGENT_TASK_TIMEOUT:-300}
      - DATA_DIR=/data
      - DISPLAY=:99
      - VNC_UPSTREAM=http://127.0.0.1:6080
      - VNC_WS_UPSTREAM=ws://127.0.0.1:6080
    volumes:
      - agent-data:/data
    shm_size: "2gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  agent-data:
