<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Agent</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121821;
      --panel2: #182131;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent2: #2563eb;
      --ok: #22c55e;
      --warn: #fbbf24;
      --danger: #ef4444;
      --border: #243044;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .app {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      grid-template-rows: auto 1fr;
      height: 100vh;
      gap: 0;
    }
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { font-size: 1rem; margin: 0; font-weight: 650; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 10px; font-size: 0.8rem; color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); }
    .dot.busy { background: var(--warn); }
    .dot.err { background: var(--danger); }
    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--panel);
      display: flex; flex-direction: column; min-height: 0;
    }
    .sidebar .section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .sidebar h2 { margin: 0 0 8px; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    textarea {
      width: 100%; min-height: 90px; resize: vertical;
      border-radius: 8px; border: 1px solid var(--border);
      background: #0c1118; color: var(--text); padding: 10px; font: inherit;
    }
    textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      appearance: none; border: 0; border-radius: 8px;
      background: var(--accent); color: white; font: inherit; font-weight: 600;
      padding: 9px 14px; cursor: pointer;
    }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.danger { background: var(--danger); }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .jobs { flex: 1; overflow: auto; padding: 8px; }
    .job {
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px; margin-bottom: 8px; cursor: pointer; background: var(--panel2);
    }
    .job.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .job .top { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--muted); }
    .job .task { margin-top: 6px; font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .status { text-transform: uppercase; font-weight: 700; font-size: .7rem; letter-spacing: .04em; }
    .status.queued, .status.running { color: var(--warn); }
    .status.completed { color: var(--ok); }
    .status.failed, .status.cancelled { color: var(--danger); }
    .main {
      display: grid;
      grid-template-rows: minmax(220px, 1fr) minmax(180px, 40%);
      min-height: 0; min-width: 0;
    }
    .viewer {
      position: relative; background: #000; border-bottom: 1px solid var(--border); min-height: 0;
    }
    .viewer iframe, .viewer img.fallback {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain; background: #000;
    }
    .viewer .overlay {
      position: absolute; left: 12px; top: 12px; z-index: 2;
      background: rgba(0,0,0,.65); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px; font-size: .8rem; color: var(--muted);
      max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .viewer .empty {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: var(--muted); text-align: center; padding: 24px;
    }
    .log-panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
    .log-panel .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid var(--border); gap: 8px;
    }
    .log {
      flex: 1; overflow: auto; padding: 10px 12px;
      font-family: var(--mono); font-size: .8rem; white-space: pre-wrap; word-break: break-word;
    }
    .log .line { margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px dashed #1c2738; }
    .log .ts { color: var(--muted); margin-right: 8px; }
    .log .tag { color: var(--accent); font-weight: 700; margin-right: 6px; }
    .log .tag.error { color: var(--danger); }
    .log .tag.result { color: var(--ok); }
    .result-box {
      margin: 0 12px 12px; padding: 10px; border-radius: 8px;
      border: 1px solid var(--border); background: #0c1118; white-space: pre-wrap;
      max-height: 120px; overflow: auto; font-size: .9rem;
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; min-height: 100vh; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--border); max-height: 45vh; }
      .main { min-height: 70vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Browser Agent</h1>
      <div class="badges">
        <span class="badge"><span id="health-dot" class="dot"></span><span id="health-label">…</span></span>
        <span class="badge" id="model-label">modelo: —</span>
      </div>
    </header>

    <aside class="sidebar">
      <div class="section">
        <h2>Nueva tarea</h2>
        <textarea id="task" placeholder="Ej: Ve a example.com y devuelve el H1"></textarea>
        <div class="row">
          <button id="btn-run" onclick="startTask()">Ejecutar</button>
          <button id="btn-cancel" class="danger" onclick="cancelTask()" disabled>Cancelar</button>
        </div>
      </div>
      <div class="section" style="padding-bottom:4px">
        <h2>Historial</h2>
      </div>
      <div id="jobs" class="jobs"></div>
    </aside>

    <main class="main">
      <section class="viewer" id="viewer">
        <div class="overlay" id="viewer-meta">Sin tarea activa</div>
        <div class="empty" id="viewer-empty">El navegador en vivo aparecerá aquí cuando haya una tarea en ejecución.</div>
        <iframe id="vnc-frame" title="noVNC" style="display:none" allow="clipboard-read; clipboard-write"></iframe>
        <img id="shot-fallback" class="fallback" alt="screenshot" style="display:none" />
      </section>
      <section class="log-panel">
        <div class="toolbar">
          <strong id="selected-title">Selecciona o lanza una tarea</strong>
          <button class="secondary" onclick="refreshJobs()">Actualizar</button>
        </div>
        <div id="result" class="result-box" style="display:none"></div>
        <div id="log" class="log"></div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      jobs: [],
      selectedId: localStorage.getItem('selectedJobId') || null,
      es: null,
      config: null,
      vncLoaded: false,
    };

    const el = (id) => document.getElementById(id);

    function statusClass(s) { return 'status ' + (s || ''); }

    function shortTime(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        return d.toLocaleString();
      } catch { return iso; }
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        state.config = data;
        el('model-label').textContent = 'modelo: ' + (data.model || '—');
        el('health-dot').className = 'dot ' + (data.busy ? 'busy' : 'ok');
        el('health-label').textContent = data.busy ? 'ocupado' : (data.api_key_configured ? 'listo' : 'sin API key');
      } catch {
        el('health-dot').className = 'dot err';
        el('health-label').textContent = 'sin conexión';
      }
    }

    async function refreshJobs() {
      const res = await fetch('/api/tasks?limit=50');
      const data = await res.json();
      state.jobs = data.jobs || [];
      renderJobs();

      const active = state.jobs.find(j => j.status === 'running' || j.status === 'queued');
      if (!state.selectedId && active) selectJob(active.id);
      else if (state.selectedId) {
        const still = state.jobs.find(j => j.id === state.selectedId);
        if (still) selectJob(still.id, false);
        else if (active) selectJob(active.id);
      } else if (state.jobs[0]) {
        selectJob(state.jobs[0].id, false);
      }
      updateRunButtons();
    }

    function renderJobs() {
      const root = el('jobs');
      if (!state.jobs.length) {
        root.innerHTML = '<div style="color:var(--muted);padding:8px;font-size:.9rem">Sin tareas aún.</div>';
        return;
      }
      root.innerHTML = state.jobs.map(j => `
        <div class="job ${j.id === state.selectedId ? 'active' : ''}" onclick="selectJob('${j.id}')">
          <div class="top">
            <span class="${statusClass(j.status)}">${j.status}</span>
            <span>${j.steps || 0} steps</span>
          </div>
          <div class="task">${escapeHtml(j.task)}</div>
          <div class="top" style="margin-top:6px"><span>${shortTime(j.created_at)}</span><span>${j.id}</span></div>
        </div>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function updateRunButtons() {
      const active = state.jobs.find(j => j.status === 'running' || j.status === 'queued');
      el('btn-run').disabled = !!active;
      const sel = state.jobs.find(j => j.id === state.selectedId);
      el('btn-cancel').disabled = !(sel && (sel.status === 'running' || sel.status === 'queued'));
    }

    async function selectJob(id, reconnect = true) {
      state.selectedId = id;
      localStorage.setItem('selectedJobId', id);
      renderJobs();
      updateRunButtons();

      const res = await fetch('/api/tasks/' + id);
      if (!res.ok) return;
      const data = await res.json();
      const job = data.job;
      el('selected-title').textContent = job.status.toUpperCase() + ' · ' + job.id;
      el('viewer-meta').textContent = job.current_url || job.status;

      const resultBox = el('result');
      if (job.result) {
        resultBox.style.display = 'block';
        resultBox.textContent = job.result;
      } else if (job.error) {
        resultBox.style.display = 'block';
        resultBox.textContent = 'Error: ' + job.error;
      } else {
        resultBox.style.display = 'none';
        resultBox.textContent = '';
      }

      const log = el('log');
      log.innerHTML = '';
      (data.events || []).forEach(appendEvent);

      if (job.status === 'running') showVnc();
      else if (job.last_screenshot || job.status === 'completed' || job.status === 'failed') showScreenshot(job.id);
      else hideViewerMedia();

      if (reconnect && (job.status === 'running' || job.status === 'queued')) {
        connectSSE(job.id);
      } else {
        closeSSE();
      }
      updateRunButtons();
    }

    function appendEvent(ev) {
      const log = el('log');
      const p = ev.payload || {};
      let body = '';
      let tag = ev.type || 'event';
      if (ev.type === 'step') {
        body = `step ${p.step || '?'}` + (p.url ? ` · ${p.url}` : '') +
          (p.action ? `\naction: ${p.action}` : '') +
          (p.thought ? `\nthought: ${p.thought}` : '');
        if (p.has_screenshot) showScreenshot(state.selectedId, true);
        if (p.url) el('viewer-meta').textContent = p.url;
      } else if (ev.type === 'log') {
        body = p.message || JSON.stringify(p);
      } else if (ev.type === 'result') {
        body = p.result || JSON.stringify(p);
        tag = 'result';
        el('result').style.display = 'block';
        el('result').textContent = p.result || '';
      } else if (ev.type === 'error') {
        body = p.message || JSON.stringify(p);
        tag = 'error';
        el('result').style.display = 'block';
        el('result').textContent = 'Error: ' + (p.message || '');
      } else if (ev.type === 'status') {
        body = 'status → ' + (p.status || '');
      } else {
        body = JSON.stringify(p);
      }
      const line = document.createElement('div');
      line.className = 'line';
      line.innerHTML = `<span class="ts">${escapeHtml((ev.ts || '').slice(11, 19))}</span>` +
        `<span class="tag ${tag === 'error' || tag === 'result' ? tag : ''}">${escapeHtml(tag)}</span>` +
        `<span>${escapeHtml(body)}</span>`;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }

    function closeSSE() {
      if (state.es) { state.es.close(); state.es = null; }
    }

    function connectSSE(jobId) {
      closeSSE();
      const es = new EventSource('/api/tasks/' + jobId + '/events');
      state.es = es;

      const handler = (e) => {
        try {
          const ev = JSON.parse(e.data);
          if (ev.type) appendEvent(ev);
          else appendEvent({ type: e.type, payload: ev, ts: new Date().toISOString() });
        } catch {}
        refreshJobsQuiet();
      };

      ['step', 'log', 'result', 'error', 'status', 'message'].forEach(t => es.addEventListener(t, handler));
      es.addEventListener('done', async () => {
        closeSSE();
        await refreshJobs();
        if (state.selectedId === jobId) selectJob(jobId, false);
      });
      es.onerror = () => {
        // browser will retry; if terminal, done event should fire on reconnect replay
      };

      showVnc();
    }

    let quietTimer = null;
    function refreshJobsQuiet() {
      clearTimeout(quietTimer);
      quietTimer = setTimeout(async () => {
        try {
          const res = await fetch('/api/tasks?limit=50');
          const data = await res.json();
          state.jobs = data.jobs || [];
          renderJobs();
          updateRunButtons();
          const sel = state.jobs.find(j => j.id === state.selectedId);
          if (sel) {
            el('selected-title').textContent = sel.status.toUpperCase() + ' · ' + sel.id;
            if (sel.current_url) el('viewer-meta').textContent = sel.current_url;
          }
        } catch {}
      }, 800);
    }

    function showVnc() {
      const path = (state.config && state.config.vnc_path) || '/vnc/vnc.html?autoconnect=1&resize=scale';
      const frame = el('vnc-frame');
      const empty = el('viewer-empty');
      const shot = el('shot-fallback');
      empty.style.display = 'none';
      shot.style.display = 'none';
      if (!state.vncLoaded || frame.style.display === 'none') {
        // path query: ensure websocket path works behind proxy
        // noVNC uses "path" query for websocket relative path
        let src = path;
        if (!src.includes('path=')) {
          src += (src.includes('?') ? '&' : '?') + 'path=vnc/websockify';
        }
        // Prefer password-less connect
        if (!src.includes('autoconnect=')) src += '&autoconnect=1';
        frame.src = src;
        state.vncLoaded = true;
      }
      frame.style.display = 'block';
    }

    function showScreenshot(jobId, keepVnc) {
      const shot = el('shot-fallback');
      const frame = el('vnc-frame');
      const empty = el('viewer-empty');
      empty.style.display = 'none';
      shot.src = '/api/tasks/' + jobId + '/screenshot?t=' + Date.now();
      shot.onload = () => {
        if (!keepVnc || frame.style.display === 'none') {
          frame.style.display = 'none';
          shot.style.display = 'block';
        } else {
          // keep VNC on top while running; screenshot is fallback if user hides VNC
          shot.style.display = 'none';
        }
      };
      shot.onerror = () => {
        if (frame.style.display === 'none') empty.style.display = 'grid';
      };
      if (!keepVnc) {
        frame.style.display = 'none';
        shot.style.display = 'block';
      }
    }

    function hideViewerMedia() {
      el('vnc-frame').style.display = 'none';
      el('shot-fallback').style.display = 'none';
      el('viewer-empty').style.display = 'grid';
    }

    async function startTask() {
      const task = el('task').value.trim();
      if (!task) return;
      el('btn-run').disabled = true;
      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const detail = data.detail;
          const msg = typeof detail === 'object' ? (detail.message || JSON.stringify(detail)) : (detail || res.status);
          alert('Error: ' + msg);
          if (detail && detail.active_job_id) selectJob(detail.active_job_id);
          return;
        }
        el('task').value = '';
        await refreshJobs();
        selectJob(data.id, true);
      } catch (e) {
        alert('Error de red: ' + e.message);
      } finally {
        updateRunButtons();
      }
    }

    async function cancelTask() {
      if (!state.selectedId) return;
      el('btn-cancel').disabled = true;
      try {
        await fetch('/api/tasks/' + state.selectedId + '/cancel', { method: 'POST' });
        await refreshJobs();
        selectJob(state.selectedId, true);
      } catch (e) {
        alert(e.message);
      } finally {
        updateRunButtons();
      }
    }

    // boot
    (async function init() {
      await loadConfig();
      await refreshJobs();
      setInterval(loadConfig, 15000);
      setInterval(() => {
        const active = state.jobs.some(j => j.status === 'running' || j.status === 'queued');
        if (!active) refreshJobs().catch(() => {});
      }, 10000);
    })();
  </script>
</body>
</html>
